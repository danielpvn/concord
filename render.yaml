services:
  - type: web
    name: concord
    env: node
    plan: free
    region: ohio
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      # Postgres persistente (ex.: Neon). Com file:./dev.db os dados somem a cada deploy.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
